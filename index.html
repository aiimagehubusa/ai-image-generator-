<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free AI Image Generator USA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="100% Free AI Image Generator for USA users. No API, no signup. Create images instantly using AI.">
<style>
body {
  font-family: Arial, sans-serif;
  background:#0f172a;
  color:#fff;
  text-align:center;
  padding:20px;
}
input {
  width:90%;
  max-width:500px;
  padding:12px;
  font-size:16px;
  border-radius:8px;
  border:none;
}
button {
  margin-top:12px;
  padding:12px 24px;
  font-size:18px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
img {
  margin-top:20px;
  max-width:90%;
  border-radius:12px;
}
footer {
  margin-top:40px;
  font-size:14px;
  opacity:0.7;
}
</style>
</head>
<body>

<h1>🖼️ Free AI Image Generator</h1>
<p>USA Users • No API • 100% Free</p>

<input id="prompt" placeholder="Type your image prompt..." />
<br>
<button onclick="generate()">Generate Image</button>

<div id="output"></div>

<footer>
Powered by Pollinations.ai • aiimagehubusa
</footer>

<script>
function generate() {
  const prompt = document.getElementById("prompt").value;
  if (!prompt) return alert("Please type a prompt");
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt);
  document.getElementById("output").innerHTML =
    `<img src="${url}" alt="AI Image">`;
}
</script>

</body>
</html>
