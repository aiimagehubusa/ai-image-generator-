<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Image Hub | USA Viral & Multi-Language Generator</title>
    <meta name="description" content="Free AI Image Generator for USA Trends, Etsy, & T-Shirt designs. Supports English, Bengali, Hindi, Arabic & more.">
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/cropperjs/dist/cropper.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1;
            --accent: #f43f5e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --ad-color: #fbbf24;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- ADSTERRA SMART LINK STYLES --- */
        .ad-top-bar {
            background: linear-gradient(90deg, #f43f5e, #6366f1);
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            animation: pulse 2s infinite;
        }

        .pro-badge-btn {
            background: #fbbf24;
            color: #000;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.3s;
        }

        @keyframes pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.9; }
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
        }

        h1 { font-size: clamp(28px, 6vw, 48px); margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 30px; }

        .search-area {
            max-width: 800px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border-radius: 12px;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        select, .gen-btn {
            padding: 12px;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            font-weight: 600;
            cursor: pointer;
        }

        .gen-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
        }

        /* --- USA Style Animated Loader --- */
        #loader-container {
            display: none;
            margin: 30px auto;
            text-align: center;
        }

        .usa-loader {
            width: 80px;
            height: 80px;
            border: 4px solid #334155;
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            margin: auto;
            animation: spin 1s linear infinite;
            position: relative;
        }

        .usa-loader::after {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s ease-out infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Output Grid */
        #output-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 50px;
            padding-bottom: 100px;
        }

        .img-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid transparent;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .img-card img { width: 100%; height: auto; display: block; background: #000; min-height: 200px; }
        .img-card.selected { border-color: var(--accent); transform: scale(1.02); }

        .action-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.95);
            padding: 15px 25px;
            border-radius: 50px;
            display: none;
            gap: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--primary);
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ad-card-native {
            background: linear-gradient(45deg, #1e293b, #334155);
            border: 2px dashed var(--ad-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            border-radius: 15px;
            text-decoration: none;
            color: white;
        }

        @media (max-width: 600px) {
            .controls { grid-template-columns: 1fr; }
            .action-bar { width: 90%; flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

<a href="https://backstageemergencyblame.com/e9mwu5szk4?key=b2b4c77ab9df726c7e20236b43ad7477" target="_blank" class="ad-top-bar">
    🔥 4K HD Ultra High-Resolution is Active! Unlock Pro Features Now 🚀
</a>

<header>
    <a href="#" class="logo">AI Image Hub</a>
    <a href="https://backstageemergencyblame.com/e9mwu5szk4?key=b2b4c77ab9df726c7e20236b43ad7477" target="_blank" class="pro-badge-btn">⭐ PRO</a>
</header>

<section class="hero">
    <div class="main-container">
        <h1>Global Creative AI</h1>
        <p>Supports English, বাংলা, हिंदी & more! Perfect for Etsy & T-Shirts.</p>

        <div class="search-area">
            <textarea id="promptInput" placeholder="লিখুন আপনার মনের কথা... (e.g. 'বাংলার বাঘ' or 'Cyberpunk USA Street')"></textarea>

            <div class="controls">
                <select id="imgCount">
                    <option value="1">Generate 1 Image</option>
                    <option value="2">Generate 2 Images</option>
                    <option value="3">Generate 3 Images</option>
                    <option value="4" selected>Generate 4 Images (Max)</option>
                </select>

                <select id="aspectRatio">
                    <option value="1024/1024">Square (1:1)</option>
                    <option value="720/1280">Vertical (9:16)</option>
                    <option value="1280/720">Horizontal (16:9)</option>
                </select>

                <button class="gen-btn" onclick="generateImages()">🚀 Generate Art</button>
            </div>
        </div>

        <div id="loader-container">
            <div class="usa-loader"></div>
            <p id="loader-text" style="margin-top: 15px; color: var(--accent); font-weight: 600;">AI is thinking...</p>
        </div>
    </div>
</section>

<div class="main-container" style="padding: 0 20px;">
    <div id="output-grid">
        <!-- Ad Card -->
        <a href="https://backstageemergencyblame.com/e9mwu5szk4?key=b2b4c77ab9df726c7e20236b43ad7477" target="_blank" class="ad-card-native">
            <i class="fas fa-bolt" style="font-size: 30px; color: #fbbf24; margin-bottom: 10px;"></i>
            <h3>Remove Watermark</h3>
            <p>Get 8K Quality without ads.</p>
            <span style="background:var(--accent); padding: 5px 15px; border-radius: 5px; font-size: 12px;">Upgrade Now</span>
        </a>
    </div>
</div>

<div class="action-bar" id="actionBar">
    <button style="background:#38bdf8; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer" onclick="startCrop()">✂️ Crop</button>
    <button style="background:#22c55e; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer" id="mainDownloadBtn" onclick="downloadImage()">⬇️ Download</button>
    <button style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer" onclick="deselect()">✕</button>
</div>

<script src="https://unpkg.com/cropperjs/dist/cropper.min.js"></script>
<script>
    let selectedImgUrl = "";
    let selectedImgElement = null;
    let cropper = null;

    // --- Bengali/Hindi Translation Helper ---
    async function translateToEnglish(text) {
        // Detect if text contains non-English characters
        if (/^[a-zA-Z0-9\s,.]+$/.test(text)) return text;
        
        try {
            const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=autodetect|en`);
            const data = await res.json();
            return data.responseData.translatedText;
        } catch (e) {
            return text; // Fallback to original
        }
    }

    async function generateImages() {
        const rawPrompt = document.getElementById("promptInput").value.trim();
        if (!rawPrompt) {
            alert("Please enter a prompt!");
            return;
        }

        const grid = document.getElementById("output-grid");
        const loader = document.getElementById("loader-container");
        const loaderText = document.getElementById("loader-text");
        const count = document.getElementById("imgCount").value;
        const ratio = document.getElementById("aspectRatio").value.split('/');

        loader.style.display = "block";
        loaderText.innerText = "Translating & Processing...";

        // Step 1: Translate
        const translatedPrompt = await translateToEnglish(rawPrompt);
        loaderText.innerText = "AI is generating your vision...";

        const encodedPrompt = encodeURIComponent(translatedPrompt + ", high quality, 8k, photorealistic");
        
        // Clear previous selection
        deselect();

        const promises = [];
        for (let i = 0; i < count; i++) {
            const seed = Math.floor(Math.random() * 9999999);
            const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=${ratio[0]}&height=${ratio[1]}&nologo=true`;
            promises.push(loadImage(url));
        }

        try {
            const results = await Promise.all(promises);
            results.forEach(url => {
                const card = document.createElement("div");
                card.className = "img-card";
                card.innerHTML = `<img src="${url}" alt="AI Art">`;
                
                card.onclick = function() {
                    document.querySelectorAll('.img-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedImgUrl = url;
                    selectedImgElement = card.querySelector('img');
                    document.getElementById("actionBar").style.display = "flex";
                };

                grid.insertBefore(card, grid.firstChild);
            });
        } catch (err) {
            alert("Something went wrong. Try again.");
        } finally {
            loader.style.display = "none";
        }
    }

    // Helper to ensure image is loaded before showing
    function loadImage(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = url;
            img.onload = () => resolve(url);
            img.onerror = () => resolve(url);
        });
    }

    async function downloadImage() {
        if (!selectedImgUrl) return;
        const btn = document.getElementById("mainDownloadBtn");
        btn.innerHTML = "⏳ Processing...";
        
        // 50% chance to show ad before download
        if(Math.random() > 0.5) {
             window.open("https://backstageemergencyblame.com/e9mwu5szk4?key=b2b4c77ab9df726c7e20236b43ad7477", "_blank");
        }

        try {
            const response = await fetch(selectedImgUrl);
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = blobUrl;
            link.download = `AI-Hub-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } catch (e) {
            window.open(selectedImgUrl, '_blank'); // Fallback
        } finally {
            btn.innerHTML = "⬇️ Download";
        }
    }

    function startCrop() {
        if (!selectedImgElement) return;
        if (cropper) cropper.destroy();
        cropper = new Cropper(selectedImgElement, { 
            aspectRatio: NaN,
            viewMode: 1 
        });
    }

    function deselect() {
        document.getElementById("actionBar").style.display = "none";
        document.querySelectorAll('.img-card').forEach(c => c.classList.remove('selected'));
        if (cropper) {
            cropper.destroy();
            cropper = null;
        }
    }
</script>

</body>
</html>
